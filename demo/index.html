<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ui-design-workflow demo</title>
<style>
  :root { --ui-color-primary: #1A4D3A; --ui-color-surface: #FFFFFF; --ui-color-border: #E5E7EB; --ui-color-text: #111827; --ui-color-muted: #6B7280; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #fff; color: var(--ui-color-text); }
  main { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
  h1 { font-size: 40px; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 12px; }
  p { color: var(--ui-color-muted); line-height: 1.6; }
  button { background: var(--ui-color-primary); color: #fff; border: none; border-radius: 8px; padding: 12px 20px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <h1>Make room for the work that matters.</h1>
    <p>This is a minimal self-contained page used to verify the local renderer.</p>
    <button type="button">Start a free trial</button>
  </main>
</body>
</html>
