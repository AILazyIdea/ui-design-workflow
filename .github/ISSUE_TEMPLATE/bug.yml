name: Bug report
description: Report a reproducible problem in a core script, schema or MCP tool.
body:
  - type: input
    id: version
    attributes:
      label: ui-design-workflow version and Node version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Do not include secrets, private URLs, customer screenshots or personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
